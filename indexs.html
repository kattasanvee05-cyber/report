<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1efff;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 420px;
            margin: 20px auto;
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            text-align: center;
            color: #5145cd;
            margin-bottom: 8px;
        }

        p {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #5145cd;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4035ad;
        }

        #dashboard {
            display: none;
        }

        .success {
            color: green;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container" id="registration">
        <h1>Event Registration</h1>
        <p>Register now and be part of the event!</p>

        <form id="eventForm">
            <label>Full Name</label>
            <input type="text" id="name"
                   placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" id="email"
                   placeholder="example@gmail.com" required>

            <label>Mobile Number</label>
            <input type="tel" id="phone"
                   placeholder="Enter 10-digit mobile number"
                   pattern="[6-9][0-9]{9}"
                   maxlength="10" inputmode="numeric" required>

            <label>College Name</label>
            <input type="text" id="college"
                   placeholder="Enter your college name" required>

            <label>Select Event</label>
            <select id="event" required>
                <option value="">Choose an event</option>
                <option>Technical Workshop</option>
                <option>Hackathon</option>
                <option>Cultural Fest</option>
                <option>Sports Meet</option>
            </select>

            <button type="submit">Register Now</button>
        </form>
    </div>

    <div class="container" id="dashboard">
        <h1>Registration Successful!</h1>
        <p class="success">You have registered successfully.</p>

        <h3>Your Details</h3>
        <p id="details"></p>

        <button onclick="location.reload()">Register Another</button>
    </div>

    <script>
        const phone = document.getElementById("phone");

        phone.addEventListener("input", function () {
            this.value = this.value.replace(/\D/g, "").slice(0, 10);
        });

        document.getElementById("eventForm").addEventListener("submit",
            function (e) {
                e.preventDefault();

                document.getElementById("details").innerHTML =
                    "<b>Name:</b> " + escapeHTML(document.getElementById("name").value) + "<br><br>" +
                    "<b>Email:</b> " + escapeHTML(document.getElementById("email").value) + "<br><br>" +
                    "<b>Mobile:</b> " + escapeHTML(phone.value) + "<br><br>" +
                    "<b>College:</b> " + escapeHTML(document.getElementById("college").value) + "<br><br>" +
                    "<b>Event:</b> " + escapeHTML(document.getElementById("event").value);

                document.getElementById("registration").style.display = "none";
                document.getElementById("dashboard").style.display = "block";
            });

        function escapeHTML(value) {
            return value.replace(/[&<>"']/g, function (char) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                }[char];
            });
        }
    </script>
</body>
</html>
